<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CloudCraft — Infrastructure Visualizer</title>
    <meta name="description" content="CloudCraft: Visualize Terraform, CloudFormation, CDK and more as interactive AWS architecture diagrams, instantly." />
    <script>
      // Dark by default — only go light if explicitly set
      try {
        const t = localStorage.getItem('theme');
        if (t !== 'light') document.documentElement.classList.add('dark');
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body class="bg-black dark:bg-black text-neutral-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
